name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · tests · dry-run smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q src cli.py main.py demo.py

      - name: Unit + integration tests
        run: pytest tests -q --maxfail=1

      - name: Dry-run smoke (UI build, CLI, demo)
        env:
          WAN_DRY_RUN: "1"
          WAN_DATA_DIR: ${{ runner.temp }}/wan_gateway
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from src.gradio_app import WanStudio
          ui = WanStudio().create_interface()
          print("UI blocks:", len(ui.blocks))
          EOF
          python cli.py models
          python cli.py catalog
          python cli.py generate --model wan3.0-video -p "ci smoke" --duration 5 --dry-run > /dev/null
          python cli.py image --model wan2.7-image-pro -p "ci smoke" --dry-run > /dev/null
          python cli.py tts --model qwen3-tts-flash --text "ci smoke" --dry-run > /dev/null
          python demo.py > /dev/null

  docker:
    name: Docker build + boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wan-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container in dry-run mode and probe /
        run: |
          docker run -d --name wan -p 7860:7860 -e WAN_DRY_RUN=1 wan-gateway:ci
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:7860/; then echo "up after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "container did not answer"; docker logs wan; exit 1
